{% extends "base.html" %}
{% block extra_head %}
{% load static %}

    <meta charset="utf-8"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/profile657/base.css' %}" >
{% endblock extra_head %}
{% block content %}
    <div class="profile657">
        <h1>Sign up</h1>
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Sign Up</button>

        </form>
    </div>
{% endblock %}
