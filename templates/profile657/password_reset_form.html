{% extends "base.html" %}
{% block extra_head %}
{% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/profile657/base.css' %}" >
{% endblock extra_head %}
{% block content %}
    <div class="profile657" >
        <h2>Reset password</h2>
        <form action="" method="post">
        {% csrf_token %}
        {% if form.email.errors %}
            {{ form.email.errors }}
        {% endif %}
            <p>{{ form.email }}</p>
            <button type="submit" value="Reset password">Reset password</button>
            <button onclick="window.history.back()">Cancel</button>
        </form>
    </div>
{% endblock %}
