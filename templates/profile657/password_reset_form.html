{% extends "base.html" %}
{% block content %}
  <h2>Reset password</h2>
  <form action="" method="post">
  {% csrf_token %}
  {% if form.email.errors %}
    {{ form.email.errors }}
  {% endif %}
      <p>{{ form.email }}</p>
    <button type="submit" value="Reset password">Reset password</button>
    <button onclick="window.history.back()">Cancel</button>
  </form>
{% endblock %}
