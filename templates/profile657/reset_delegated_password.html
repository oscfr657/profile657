{% extends 'base.html' %}

{% block content %}
<div >
    <h2>Change Password for {{ target_user.username }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" >Save New Password</button>
    </form>
    <a href="{% url 'managed_users' %}" >Cancel</a>
</div>
{% endblock %}
